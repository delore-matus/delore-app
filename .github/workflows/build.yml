name: Build DeLore

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact: windows
            args: --bundles nsis
            assetNamePattern: DeLore-windows-x64[ext]
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            artifact: macos
            args: --target universal-apple-darwin --bundles dmg
            assetNamePattern: DeLore-macos-universal[ext]
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            artifact: linux
            args: --bundles appimage,deb
            assetNamePattern: DeLore-linux-amd64[ext]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Add x86_64 target for universal macOS build
        if: matrix.artifact == 'macos'
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: delore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          workflowArtifactNamePattern: ${{ matrix.assetNamePattern }}
          uploadWorkflowArtifacts: true
      - name: Build MSI without publishing it
        if: matrix.artifact == 'windows'
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop
          args: --bundles msi --no-sign
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: DeLore-windows-x64[ext]
