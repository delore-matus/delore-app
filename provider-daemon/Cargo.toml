[package]
name = "provider-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
provider-core = { path = "../provider-core" }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sha3 = "0.10"

[package.metadata]

[[bin]]
name = "gpuswarm"
path = "src/main.rs"

