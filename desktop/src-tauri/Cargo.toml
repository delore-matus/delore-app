[package]
name = "desktop"
version = "0.1.0"
description = "DeLore provider desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
provider-core = { path = "../../provider-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-single-instance = "=2.5.5"
tokio = { version = "1", features = ["rt", "sync"] }
