[package]
name = "desktop"
version = "0.1.0"
description = "DeLore provider desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
provider-core = { path = "../../provider-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "sync"] }
