[package]
name = "provider-core"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
anyhow = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "io-util", "process", "net", "sync"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
flate2 = "1"
fs2 = "0.4"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
